<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подсказчик — помощник по учёбе</title>
<style>
:root{
  --bg:#eef3f8;--grid:#d5e0ec;--surface:#fff;--text:#1b2433;--muted:#5d6b7e;
  --accent:#2447c8;--on-accent:#fff;--border:#cdd8e6;--me:#2447c8;--me-text:#fff;
  --pen:#c8372d;--ok:#1f7a4d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121722;--grid:#1c2535;--surface:#1a2231;--text:#e6ebf4;--muted:#9aa7bb;
    --accent:#8aa4ff;--on-accent:#0e1633;--border:#2b364b;--me:#2f4fcf;--me-text:#fff;
    --pen:#ff8c82;--ok:#6fd6a1;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121722;--grid:#1c2535;--surface:#1a2231;--text:#e6ebf4;--muted:#9aa7bb;
  --accent:#8aa4ff;--on-accent:#0e1633;--border:#2b364b;--me:#2f4fcf;--me-text:#fff;
  --pen:#ff8c82;--ok:#6fd6a1;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--pen);background:var(--surface)}
h1{margin:0;font-weight:700;font-size:26px;line-height:1.1;color:var(--accent);flex:1}
select,button,textarea{font:inherit;color:inherit}
select{min-height:40px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:0 8px}
.ghost{min-height:40px;border:1px solid var(--border);background:transparent;border-radius:8px;padding:0 12px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.b{max-width:88%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--me-text);border-bottom-right-radius:3px}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--ok);border-bottom-left-radius:3px}
.hello{align-self:stretch;max-width:none;background:var(--surface);border:1px dashed var(--accent);border-left:1px dashed var(--accent)}
.hello b{display:block;margin-bottom:4px}
.typing{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 0;background:var(--bg)}
.chips[hidden]{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:20px;padding:0 14px;cursor:pointer}
.chip:disabled{opacity:.45}
.bar{display:flex;gap:8px;align-items:flex-end;padding:8px 14px 12px;background:var(--bg)}
textarea{flex:1;resize:none;max-height:140px;min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px 12px}
#send{min-height:44px;min-width:44px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 16px;cursor:pointer}
#send:disabled{opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--pen);color:#fff;border-radius:10px;padding:10px 14px;max-width:90%;display:none;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Подсказчик</h1>
    <select id="subj" aria-label="Предмет">
      <option>Математика</option><option>Физика</option><option>Химия</option>
      <option>Русский язык</option><option>Биология</option><option>История</option>
      <option>Английский язык</option><option>Информатика</option><option>Другой предмет</option>
    </select>
    <select id="grade" aria-label="Класс"></select>
    <button class="ghost" id="reset" title="Новое задание" aria-label="Новое задание">＋</button>
  </header>
  <main id="chat" aria-live="polite"></main>
  <div class="chips" id="chips" hidden>
    <button class="chip" data-a="hint">💡 Подсказка</button>
    <button class="chip" data-a="start">🧭 С чего начать?</button>
    <button class="chip" data-a="rule">📘 Объясни правило</button>
    <button class="chip" data-a="check">✅ Проверь моё решение</button>
  </div>
  <div class="bar">
    <textarea id="box" rows="1" placeholder="Напиши или вставь задание…"></textarea>
    <button id="send">Отправить</button>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var chat=$('#chat'),box=$('#box'),sendBtn=$('#send'),chips=$('#chips'),toastEl=$('#toast');
  var msgs=[],hints=0,busy=false,ctrl=null,tt=null;

  var g=$('#grade');
  for(var i=1;i<=11;i++){var o=document.createElement('option');o.value=i;o.textContent=i+' класс';if(i===7)o.selected=true;g.appendChild(o)}

  function toast(t){toastEl.textContent=t;toastEl.style.display='block';clearTimeout(tt);tt=setTimeout(function(){toastEl.style.display='none'},3500)}
  function scroll(){chat.scrollTop=chat.scrollHeight}
  function bubble(cls,text){var d=document.createElement('div');d.className='b '+cls;d.textContent=text;chat.appendChild(d);scroll();return d}

  function hello(){
    var d=document.createElement('div');d.className='b bot hello';
    d.innerHTML='<b>Привет! Давай разберёмся вместе.</b>Выбери предмет и класс, пришли задание — и я буду подсказывать шаг за шагом. Ответ я не назову: решение должно получиться у тебя.<br>Не пиши здесь имя, адрес и телефон.';
    chat.appendChild(d);
  }

  function setUI(){
    sendBtn.disabled=busy;
    var cs=chips.querySelectorAll('.chip');for(var i=0;i<cs.length;i++)cs[i].disabled=busy;
    chips.hidden=msgs.length===0&&!busy;
    box.placeholder=msgs.length?'Твоя мысль, шаг или решение…':'Напиши или вставь задание…';
  }

  function friendly(e){return (e&&e.name!=='TypeError'&&e.message)||'Нет связи с сервером. Проверь интернет и отправь ещё раз.'}

  async function ask(text,label,restore){
    if(busy)return;
    busy=true;msgs.push({role:'user',content:text});setUI();
    var me=bubble('me',label||text);
    var bot=bubble('bot typing','Думаю…');
    ctrl=new AbortController();
    try{
      var resp=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},signal:ctrl.signal,
        body:JSON.stringify({subject:$('#subj').value,grade:+g.value,messages:msgs})});
      var d=await resp.json().catch(function(){return {}});
      if(!resp.ok)throw {message:d.error};
      bot.textContent=d.text;bot.classList.remove('typing');
      msgs.push({role:'assistant',content:d.text});
    }catch(e){
      msgs.pop();me.remove();bot.remove();
      if(restore)box.value=restore;
      if(!(e&&e.name==='AbortError'))toast(friendly(e));
    }
    busy=false;setUI();scroll();
  }

  function submit(){
    var t=box.value.trim();
    if(!t||busy)return;
    box.value='';box.style.height='auto';
    ask(t,null,t);
  }

  sendBtn.addEventListener('click',submit);
  box.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter')submit()});
  box.addEventListener('input',function(){box.style.height='auto';box.style.height=Math.min(box.scrollHeight,140)+'px'});

  chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b||busy)return;
    var a=b.getAttribute('data-a');
    if(a==='hint'){
      hints++;
      ask('Дай подсказку №'+hints+'. Сделай её чуть конкретнее предыдущих, но не называй ответ и не делай последний шаг за меня.','💡 Нужна подсказка');
    }else if(a==='start'){
      ask('Я не понимаю, с чего начать. Помоги разобраться в условии: задай мне наводящие вопросы.','🧭 С чего начать?');
    }else if(a==='rule'){
      ask('Объясни правило или тему, которая нужна для этого задания, на коротком примере с другими данными. Моё задание не решай.','📘 Объясни правило');
    }else{
      var t=box.value.trim();
      if(!t){toast('Сначала напиши своё решение в поле внизу.');box.focus();return}
      box.value='';box.style.height='auto';
      ask('Проверь моё решение (правильный ответ не называй):\n'+t,null,t);
    }
  });

  $('#reset').addEventListener('click',function(){
    if(ctrl)ctrl.abort();
    msgs=[];hints=0;busy=false;chat.textContent='';hello();box.value='';setUI();
  });

  hello();setUI();
})();
</script>
</body>
</html>
